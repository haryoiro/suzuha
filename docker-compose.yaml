services:
  agent:
    build:
      context: .
      dockerfile: Dockerfile.dev
    command: ["-c", ".air.agent.toml"]
    ports:
      - "9090:9090"
    volumes:
      - .:/app
      - go-mod-cache:/go/pkg/mod
      - go-build-cache:/root/.cache/go-build
      - ./data:/data
      - ./.suzuha:/app/.suzuha:ro
      - npm-cache:/root/.npm
    env_file:
      - .env
    environment:
      - SUZUHA_CONFIG=/app/config.yaml
    stdin_open: true
    tty: true
    depends_on:
      - consolidator

  consolidator:
    build:
      context: .
      dockerfile: Dockerfile.dev
    command: ["-c", ".air.consolidator.toml"]
    volumes:
      - .:/app
      - go-mod-cache:/go/pkg/mod
      - go-build-cache:/root/.cache/go-build
      - ./data:/data
    env_file:
      - .env
    environment:
      - SUZUHA_CONFIG=/app/config.yaml

  admin:
    build:
      context: .
      dockerfile: Dockerfile.dev
    command: ["-c", ".air.admin.toml"]
    ports:
      - "8080:8080"
    volumes:
      - .:/app
      - go-mod-cache:/go/pkg/mod
      - go-build-cache:/root/.cache/go-build
      - ./data:/data
    env_file:
      - .env
    environment:
      - SUZUHA_CONFIG=/app/config.yaml
    depends_on:
      - agent

  searxng:
    image: searxng/searxng:latest
    volumes:
      - ./searxng:/etc/searxng
    environment:
      - SEARXNG_SECRET=suzuha-searxng-secret-key-2024
    restart: unless-stopped

  admin-frontend:
    image: node:22-slim
    working_dir: /app/web/admin
    command: sh -c "corepack enable && pnpm install && pnpm run dev --host 0.0.0.0"
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - node-modules:/app/web/admin/node_modules
    environment:
      - API_URL=http://admin:8080
    depends_on:
      - admin

volumes:
  go-mod-cache:
  go-build-cache:
  node-modules:
  npm-cache:
