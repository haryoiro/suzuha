services:
  agent:
    build:
      context: .
      dockerfile: Dockerfile.dev
    command: ["-c", ".air.agent.toml"]
    ports:
      - "9090:9090"
      - "8080:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - .:/app
      - go-mod-cache:/go/pkg/mod
      - go-build-cache:/root/.cache/go-build
      - ./data:/data
      - ./.suzuha:/app/.suzuha:ro
      - npm-cache:/root/.npm
      - ~/.claude:/root/.claude
    env_file:
      - .env
    environment:
      - SUZUHA_CONFIG=/app/config.yaml
    stdin_open: true
    tty: true

  searxng:
    image: searxng/searxng:latest
    volumes:
      - ./searxng:/etc/searxng
    environment:
      - SEARXNG_SECRET=suzuha-searxng-secret-key-2024
    restart: unless-stopped

  whisper:
    image: ghcr.io/ggml-org/whisper.cpp:main-cuda
    entrypoint: ["/app/build/bin/whisper-server"]
    command: ["--model", "/models/ggml-large-v3.bin", "--port", "8001", "--host", "0.0.0.0", "--language", "ja"]
    volumes:
      - ./models/whisper:/models
    environment:
      - LD_LIBRARY_PATH=/usr/lib/x86_64-linux-gnu:/usr/local/nvidia/lib:/usr/local/nvidia/lib64:/usr/local/cuda/lib64
    deploy:
      resources:
        reservations:
          devices:
            - capabilities: [gpu]
    profiles:
      - voice

  voicevox:
    image: voicevox/voicevox_engine:nvidia-latest
    deploy:
      resources:
        reservations:
          devices:
            - capabilities: [gpu]
    profiles:
      - voice

  suzuha1:
    build:
      context: .
      dockerfile: Dockerfile.dev
    command: ["-c", ".air.agent.toml"]
    ports:
      - "9091:9090"
      - "8082:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - .:/app
      - go-mod-cache:/go/pkg/mod
      - go-build-cache:/root/.cache/go-build
      - ./data/suzuha1:/data
      - ./.suzuha1:/app/.suzuha1:ro
      - npm-cache:/root/.npm
    env_file:
      - .env
    environment:
      - SUZUHA_CONFIG=/app/config.suzuha1.yaml
    profiles:
      - suzuha1

  admin-frontend:
    image: node:22-slim
    working_dir: /app/web/admin
    command: sh -c "corepack enable && pnpm install && pnpm run dev --host 0.0.0.0"
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - node-modules:/app/web/admin/node_modules
    environment:
      - API_URL=http://agent:8080
    depends_on:
      - agent

volumes:
  go-mod-cache:
  go-build-cache:
  node-modules:
  npm-cache:
