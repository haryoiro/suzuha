root = "."
tmp_dir = "tmp"

[build]
  bin = "./tmp/suzuha-agent"
  cmd = "go build -buildvcs=false -o ./tmp/suzuha-agent ./agent/cmd/suzuha-agent"
  delay = 1000
  exclude_dir = ["tmp", "docs", "vendor", ".git"]
  exclude_regex = ["_test\\.go$"]
  include_ext = ["go", "yaml"]
  include_dir = ["agent/cmd/suzuha-agent", "agent/internal"]
  kill_delay = "1s"
  send_interrupt = true
  stop_on_error = true

[log]
  time = false

[misc]
  clean_on_exit = true
