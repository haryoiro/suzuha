name: suzuha

services:
  agent:
    build:
      context: ..
      dockerfile: container/Dockerfile.dev
    command: ["-c", "container/air.agent.toml"]
    ports:
      - "9090:9090"
      - "8080:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ..:/app
      - go-mod-cache:/go/pkg/mod
      - go-build-cache:/root/.cache/go-build
      - ../data:/data
      - ../.suzuha:/app/.suzuha
      - npm-cache:/root/.npm
      - ~/.claude:/root/.claude
    env_file:
      - ../.env
    environment:
      - SUZUHA_CONFIG=/app/config.yaml
    stdin_open: true
    tty: true

  suzuha-db:
    image: paradedb/paradedb:latest
    environment:
      POSTGRES_DB: suzuha
      POSTGRES_USER: suzuha
      POSTGRES_PASSWORD: suzuha
    ports:
      - "5432:5432"
    volumes:
      - suzuha-db:/var/lib/postgresql
    restart: unless-stopped

  searxng:
    image: searxng/searxng:latest
    volumes:
      - ./searxng:/etc/searxng
    environment:
      - SEARXNG_SECRET=suzuha-searxng-secret-key-2024
    restart: unless-stopped

  # whisper:
  #   image: ghcr.io/ggml-org/whisper.cpp:main-cuda
  #   entrypoint: ["/app/build/bin/whisper-server"]
  #   command: ["--model", "/models/ggml-large-v3.bin", "--port", "8001", "--host", "0.0.0.0", "--language", "ja"]
  #   volumes:
  #     - ../models/whisper:/models
  #   environment:
  #     - LD_LIBRARY_PATH=/usr/lib/x86_64-linux-gnu:/usr/local/nvidia/lib:/usr/local/nvidia/lib64:/usr/local/cuda/lib64
  #   deploy:
  #     resources:
  #       reservations:
  #         devices:
  #           - capabilities: [gpu]
  #   profiles:
  #     - voice

  voicevox:
    image: voicevox/voicevox_engine:cpu-latest
    restart: unless-stopped

  sbv2:
    build: ./sbv2
    volumes:
      - sbv2-models:/models
      - sbv2-cache:/root/.cache
    environment:
      - SBV2_MODEL_REPO=litagin/sbv2_koharune_ami
      - SBV2_MODEL_NAME=koharune_ami
    deploy:
      resources:
        reservations:
          devices:
            - capabilities: [gpu]
    profiles:
      - voice

  admin-frontend:
    image: node:22-slim
    working_dir: /app/web/admin
    command: sh -c "corepack enable && pnpm install && pnpm run dev --host 0.0.0.0"
    ports:
      - "5173:5173"
    volumes:
      - ..:/app
      - node-modules:/app/web/admin/node_modules
    environment:
      - API_URL=http://agent:8080
    depends_on:
      - agent

  widget-frontend:
    image: node:22-slim
    working_dir: /app/web/widget
    command: sh -c "corepack enable && pnpm install && pnpm run dev --host 0.0.0.0"
    ports:
      - "5174:5174"
    volumes:
      - ..:/app
      - widget-node-modules:/app/web/widget/node_modules
    environment:
      - API_URL=http://agent:9090
    depends_on:
      - agent

  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate run --token ${CLOUDFLARED_TOKEN}
    env_file:
      - ../.env
    restart: unless-stopped
    depends_on:
      - agent
      - admin-frontend

  yolo:
    build: ./yolo
    restart: unless-stopped
    environment:
      SCORE_THRESHOLD: "0.50"

  firmware-p4:
    build:
      context: ../firmware
      args:
        TARGET: esp32p4
    profiles:
      - firmware

  firmware-esp32:
    build:
      context: ../firmware
      args:
        TARGET: esp32
    profiles:
      - firmware

  langfuse-redis:
    image: redis:7-alpine
    command: redis-server --requirepass langfuse
    restart: unless-stopped

  langfuse-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: langfuse
      POSTGRES_USER: langfuse
      POSTGRES_PASSWORD: langfuse
    volumes:
      - langfuse-db:/var/lib/postgresql/data
    restart: unless-stopped

  langfuse-minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: langfuse
      MINIO_ROOT_PASSWORD: langfuse
    volumes:
      - langfuse-minio:/data
    restart: unless-stopped

  langfuse-minio-init:
    image: minio/mc:latest
    depends_on:
      - langfuse-minio
    entrypoint: >
      /bin/sh -c "
      sleep 5;
      mc alias set myminio http://langfuse-minio:9000 langfuse langfuse;
      mc mb --ignore-existing myminio/langfuse;
      exit 0;
      "

  langfuse-clickhouse:
    image: clickhouse/clickhouse-server:24-alpine
    environment:
      CLICKHOUSE_USER: langfuse
      CLICKHOUSE_PASSWORD: langfuse
    volumes:
      - langfuse-clickhouse:/var/lib/clickhouse
      - ./clickhouse/config.xml:/etc/clickhouse-server/config.d/keeper.xml:ro
    restart: unless-stopped

  langfuse:
    image: langfuse/langfuse:3
    depends_on:
      - langfuse-db
      - langfuse-clickhouse
      - langfuse-redis
      - langfuse-minio
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: "postgresql://langfuse:langfuse@langfuse-db:5432/langfuse"
      CLICKHOUSE_URL: "http://langfuse-clickhouse:8123"
      CLICKHOUSE_MIGRATION_URL: "clickhouse://langfuse-clickhouse:9000"
      CLICKHOUSE_USER: langfuse
      CLICKHOUSE_PASSWORD: langfuse
      REDIS_HOST: "langfuse-redis"
      REDIS_PORT: "6379"
      REDIS_AUTH: "langfuse"
      NEXTAUTH_URL: "http://localhost:3000"
      NEXTAUTH_SECRET: "suzuha-langfuse-secret"
      SALT: "suzuha-langfuse-salt"
      LANGFUSE_INIT_ORG_ID: "suzuha"
      LANGFUSE_INIT_ORG_NAME: "Suzuha"
      LANGFUSE_INIT_PROJECT_ID: "suzuha-agent"
      LANGFUSE_INIT_PROJECT_NAME: "Suzuha Agent"
      LANGFUSE_INIT_PROJECT_PUBLIC_KEY: "pk-lf-suzuha"
      LANGFUSE_INIT_PROJECT_SECRET_KEY: "sk-lf-suzuha"
      LANGFUSE_INIT_USER_EMAIL: "admin@suzuha.local"
      LANGFUSE_INIT_USER_PASSWORD: "admin1234"
      LANGFUSE_INIT_USER_NAME: "Admin"
      LANGFUSE_S3_EVENT_UPLOAD_ENABLED: "true"
      LANGFUSE_S3_EVENT_UPLOAD_BUCKET: "langfuse"
      LANGFUSE_S3_EVENT_UPLOAD_REGION: "auto"
      LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: "langfuse"
      LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: "langfuse"
      LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: "http://langfuse-minio:9000"
      LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: "true"
    restart: unless-stopped

  langfuse-worker:
    image: langfuse/langfuse-worker:3
    depends_on:
      - langfuse-db
      - langfuse-clickhouse
      - langfuse-redis
      - langfuse-minio
    environment:
      DATABASE_URL: "postgresql://langfuse:langfuse@langfuse-db:5432/langfuse"
      CLICKHOUSE_URL: "http://langfuse-clickhouse:8123"
      CLICKHOUSE_MIGRATION_URL: "clickhouse://langfuse-clickhouse:9000"
      CLICKHOUSE_USER: langfuse
      CLICKHOUSE_PASSWORD: langfuse
      REDIS_HOST: "langfuse-redis"
      REDIS_PORT: "6379"
      REDIS_AUTH: "langfuse"
      LANGFUSE_S3_EVENT_UPLOAD_ENABLED: "true"
      LANGFUSE_S3_EVENT_UPLOAD_BUCKET: "langfuse"
      LANGFUSE_S3_EVENT_UPLOAD_REGION: "auto"
      LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: "langfuse"
      LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: "langfuse"
      LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: "http://langfuse-minio:9000"
      LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: "true"
      SALT: "suzuha-langfuse-salt"
    restart: unless-stopped

volumes:
  go-mod-cache:
  go-build-cache:
  node-modules:
  widget-node-modules:
  npm-cache:
  sbv2-models:
  sbv2-cache:
  suzuha-db:
  langfuse-db:
  langfuse-clickhouse:
  langfuse-minio:
