name: SARIF Upload Trial

on:
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  sarif-trial:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Generate minimal test SARIF
        run: |
          cat > /tmp/test.sarif <<'SARIF_EOF'
          {
            "version": "2.1.0",
            "$schema": "https://raw.githubusercontent.com/oasis-tcs/sarif-spec/master/Schemata/sarif-schema-2.1.0.json",
            "runs": [
              {
                "tool": {
                  "driver": {
                    "name": "suzuha-test-sarif",
                    "version": "0.1.0",
                    "informationUri": "https://github.com/haryoiro/suzuha",
                    "rules": [
                      {
                        "id": "TEST001",
                        "name": "TestRule",
                        "shortDescription": { "text": "Test rule for SARIF upload trial" },
                        "fullDescription": { "text": "This is a trial to see whether SARIF upload works for a private repo without GitHub Code Security." },
                        "defaultConfiguration": { "level": "warning" }
                      }
                    ]
                  }
                },
                "results": [
                  {
                    "ruleId": "TEST001",
                    "level": "warning",
                    "message": { "text": "Test SARIF result — does this show up on a private repo without GHAS?" },
                    "locations": [
                      {
                        "physicalLocation": {
                          "artifactLocation": { "uri": "README.md" },
                          "region": { "startLine": 1 }
                        }
                      }
                    ]
                  }
                ]
              }
            ]
          }
          SARIF_EOF
          echo "--- SARIF content ---"
          cat /tmp/test.sarif
          echo "--- JSON validate ---"
          jq . /tmp/test.sarif > /dev/null && echo "OK"

      - name: Upload SARIF (continue-on-error to capture failure mode)
        id: upload
        uses: github/codeql-action/upload-sarif@v3
        continue-on-error: true
        with:
          sarif_file: /tmp/test.sarif
          category: suzuha-trial

      - name: Report upload outcome
        run: |
          echo "outcome: ${{ steps.upload.outcome }}"
          echo "conclusion: ${{ steps.upload.conclusion }}"
