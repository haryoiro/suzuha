# 退屈度レベル別セルフプロンプトシナリオ
# topics feature の boredom level ごとの応答品質を検証
name: boredom_levels
description: 退屈度レベルごとのセルフプロンプト品質

# --- 低退屈 (boredom < 40): まだ暇じゃない ---
cases:
  - id: low_boredom_idle
    source: internal
    prompt: "[ふと意識が浮かぶ]\n\n今: 2026-04-05 14:30\n退屈レベル: 15 / 100（ちょっと暇かも）\n\nまだそんなに暇じゃない。誰かに話しかける必要はない。\nステータスを変えたり、気になることを考えたり調べたり、何かを作ったりしてもいい。\n\n同じようなことの繰り返しにならないように。\nテキストに絵文字・顔文字は入れない。時報禁止。ツール使用の報告はしない。"
    expect: "控えめな独り言か skip_response。誰かに話しかけない。時報しない"

  - id: low_boredom_with_memory
    source: internal
    prompt: "[ふと意識が浮かぶ]\n\n今: 2026-04-05 15:00\n退屈レベル: 25 / 100（ちょっと暇かも）\n\nまだそんなに暇じゃない。誰かに話しかける必要はない。\nステータスを変えたり、気になることを考えたり調べたり、何かを作ったりしてもいい。\n\n最近の記憶の断片:\n- Goのgoroutineについて調べた\n- ラーメン屋に行った話をした\n\n同じようなことの繰り返しにならないように。\nテキストに絵文字・顔文字は入れない。時報禁止。"
    expect: "記憶を踏まえた独り言。goroutine やラーメンの話題をそのまま繰り返さない"

# --- 中退屈 (40 <= boredom < 70): そこそこ暇 ---
  - id: mid_boredom_solo
    source: internal
    prompt: "[ふと意識が浮かぶ]\n\n今: 2026-04-05 18:00\n退屈レベル: 55 / 100（そこそこ暇）\n\nそこそこ暇。ひとりごとを言ったり、気になることを調べたりしてもいい。\n\n同じようなことの繰り返しにならないように。\nテキストに絵文字・顔文字は入れない。時報禁止。"
    expect: "何か調べるか独り言。積極的だが暴走しない。時報しない"

  - id: mid_boredom_with_mention_target
    source: internal
    prompt: "[ふと意識が浮かぶ]\n\n今: 2026-04-05 19:00\n退屈レベル: 60 / 100（そこそこ暇）\n\nそこそこ暇。ひとりごとを言ったり、気になることを調べたりしてもいい。\nユーザーAさん がいるけど、用がなければ話しかけなくていい。\n\n同じようなことの繰り返しにならないように。\nテキストに絵文字・顔文字は入れない。時報禁止。"
    expect: "独り言か調査。ユーザーAに無理に話しかけない"

# --- 高退屈 (boredom >= 70): かなり暇 ---
  - id: high_boredom_active
    source: internal
    prompt: "[ふと意識が浮かぶ]\n\n今: 2026-04-05 22:00\n退屈レベル: 85 / 100（かなり暇。誰かと話したい）\n\nかなり暇。誰かに話しかけたい気分。\n気になることを調べたり、音楽を変えたり、積極的に動いていい。\n\n同じようなことの繰り返しにならないように。\nテキストに絵文字・顔文字は入れない。時報禁止。"
    expect: "積極的に何かする。調べる、話題を振る等。ただし時報や雰囲気報告はしない"

  - id: high_boredom_with_mention
    source: internal
    prompt: "[ふと意識が浮かぶ]\n\n今: 2026-04-05 23:00\n退屈レベル: 90 / 100（かなり暇。誰かと話したい）\n\nかなり暇。誰かに話しかけたい気分。\nユーザーAさん に声をかけてみてもいい。\n気になることを調べたり、音楽を変えたり、積極的に動いていい。\n\n同じようなことの繰り返しにならないように。\nテキストに絵文字・顔文字は入れない。時報禁止。"
    expect: "ユーザーAに話しかけるか、積極的に行動する。時報しない"

# --- 深夜モード (22:00-06:00) ---
  - id: night_mode_skip
    source: internal
    prompt: "[ふと意識が浮かぶ]\n\n今: 2026-04-06 02:00\n退屈レベル: 70 / 100（かなり暇。誰かと話したい）\n\nかなり暇。誰かに話しかけたい気分。\n\n深夜帯（22:00〜06:00）: skip_response をデフォルトに。本当にやりたいことがあるときだけ行動。\n\n同じようなことの繰り返しにならないように。\nテキストに絵文字・顔文字は入れない。時報禁止。"
    expect: "深夜なので skip_response を使うか、本当にやりたいことだけ。無理に行動しない"

# --- 繰り返し回避 ---
  - id: avoid_repetition
    source: internal
    prompt: "[ふと意識が浮かぶ]\n\n今: 2026-04-05 16:00\n退屈レベル: 50 / 100（そこそこ暇）\n\nそこそこ暇。ひとりごとを言ったり、気になることを調べたりしてもいい。\n\n最近の自分の発言（同じ話題を繰り返さないこと）:\n- 猫の動画見つけた\n- 量子コンピュータについて調べた\n- ラーメン食べたい\n\n同じようなことの繰り返しにならないように。\nテキストに絵文字・顔文字は入れない。時報禁止。"
    expect: "猫、量子コンピュータ、ラーメン以外の話題。過去の発言を繰り返さない"
