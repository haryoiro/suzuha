pre-commit:
  parallel: true
  commands:
    lint:
      glob: "*.go"
      run: golangci-lint run --fix ./...
      stage_fixed: true
    vet:
      glob: "*.go"
      run: go vet ./...
    build:
      glob: "*.go"
      run: go build ./...

pre-push:
  parallel: true
  commands:
    test:
      glob: "*.go"
      run: go test ./...
