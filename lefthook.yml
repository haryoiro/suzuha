commit-msg:
  commands:
    commitlint:
      run: commitlint lint --message {1}
    japanese-description:
      run: head -1 {1} | sed 's/^[^:]*:\ //' | grep -qP '[\p{Hiragana}\p{Katakana}\p{Han}]' || { echo "❌ description は日本語で書いてください"; exit 1; }

pre-commit:
  parallel: true
  commands:
    vet:
      glob: "*.go"
      run: docker compose -f container/compose.yaml exec -T agent go vet -tags fts5 ./agent/...
    build:
      glob: "*.go"
      run: docker compose -f container/compose.yaml exec -T agent go build -buildvcs=false -tags fts5 ./agent/...
