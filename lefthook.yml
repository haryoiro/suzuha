commit-msg:
  commands:
    commitlint:
      run: commitlint lint --message {1}

pre-commit:
  parallel: true
  commands:
    lint:
      glob: "*.go"
      run: golangci-lint run --fix ./...
      stage_fixed: true
    vet:
      glob: "*.go"
      run: go vet ./...
    build:
      glob: "*.go"
      run: go build ./...
