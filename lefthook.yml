commit-msg:
  commands:
    commitlint:
      run: commitlint lint --message {1}
    japanese-description:
      run: head -1 {1} | sed 's/^[^:]*:\ //' | grep -qP '[\p{Hiragana}\p{Katakana}\p{Han}]' || { echo "❌ description は日本語で書いてください"; exit 1; }

pre-commit:
  parallel: true
  commands:
    lint:
      glob: "*.go"
      run: golangci-lint run --fix ./...
      stage_fixed: true
    vet:
      glob: "*.go"
      run: go vet ./...
    build:
      glob: "*.go"
      run: go build ./...
