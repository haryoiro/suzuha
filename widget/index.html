<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>suzuha widget</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600&family=Space+Mono:wght@400;700&family=Doto:wght@400;700&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body,
      #root {
        width: 100%;
        /* モバイルブラウザの URL/ナビバー分を引いた高さ。100vh は固定で隠される。 */
        height: 100dvh;
        overflow: hidden;
      }
      @supports not (height: 100dvh) {
        html,
        body,
        #root {
          height: 100vh;
        }
      }
      body {
        background: #000;
        color: #fff;
        font-family: "Space Grotesk", system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      .mono {
        font-family: "Space Mono", monospace;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
      .doto {
        font-family: "Doto", "Space Mono", monospace;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
