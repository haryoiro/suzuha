root = "."
tmp_dir = "tmp"

[build]
  bin = "./tmp/suzuha-admin"
  cmd = "CGO_ENABLED=1 go build -tags fts5 -o ./tmp/suzuha-admin ./cmd/suzuha-admin"
  delay = 1000
  exclude_dir = ["tmp", "docs", "vendor", ".git", "web"]
  exclude_regex = ["_test\\.go$"]
  include_ext = ["go", "yaml"]
  include_dir = ["cmd/suzuha-admin", "internal"]
  kill_delay = "1s"
  send_interrupt = true
  stop_on_error = true

[log]
  time = false

[misc]
  clean_on_exit = true
