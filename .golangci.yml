version: "2"

linters:
  default: none
  enable:
  # バグ検出系
  - govet        # Go公式の静的解析
  - staticcheck  # 高品質な静的解析（gosimple, stylecheck 含む）
  - ineffassign  # 使われない代入の検出
  - unused       # 未使用コードの検出

  # スタイル・品質系
  - gocritic     # コードスタイル・パフォーマンスの指摘
  - revive       # golintの後継、スタイルチェック
  - unconvert    # 不要な型変換の検出
  - gocyclo      # 循環的複雑度のチェック

  # その他
  - depguard      # layered import ルール強制 (target-layout.md §10.1)
  - durationcheck # time.Duration の誤用検出
  - gomodguard    # 禁止パッケージのimport検出
  - misspell      # スペルミス検出
  - usetesting    # テストでのos.Setenv使用を検出（tenvの後継）

  settings:
    misspell:
      locale: US

    staticcheck:
      checks:
      - 'all'
      - '-ST1000'
      - '-ST1003'
      - '-ST1005'
      - '-ST1020'
      - '-SA1008'

    # depguard: target-layout.md §10.1 の import 制約を強制する。
    # 現行コードベースではまだ capability/ 等のパスが存在しないため、
    # 該当ルールは空ディレクトリに対して no-op になる。Phase 2〜11 で
    # 実パスが増えるに従って順次 bite する。
    depguard:
      rules:
        # port は実装を一切知らない (契約層)
        port-is-pure:
          list-mode: lax
          files:
          - '**/agent/internal/port/**'
          deny:
          - pkg: 'github.com/haryoiro/suzuha/internal/capability'
            desc: 'port は capability 実装を import しない'
          - pkg: 'github.com/haryoiro/suzuha/internal/behavior'
            desc: 'port は behavior を import しない'
          - pkg: 'github.com/haryoiro/suzuha/internal/runtime'
            desc: 'port は runtime を import しない'
          - pkg: 'github.com/haryoiro/suzuha/internal/adapter'
            desc: 'port は adapter を import しない'

        # capability/X は 他 capability/Y を直接 import 禁止、port/ 経由のみ
        capability-siblings:
          list-mode: lax
          files:
          - '**/agent/internal/capability/*/**'
          deny:
          - pkg: 'github.com/haryoiro/suzuha/internal/capability'
            desc: 'capability 同士の直接 import は禁止。port/ 経由で使うこと'
          - pkg: 'github.com/haryoiro/suzuha/internal/behavior'
            desc: 'capability は behavior を import しない'

        # behavior/X は 他 behavior/Y も capability/Y も直接 import 禁止
        behavior-siblings:
          list-mode: lax
          files:
          - '**/agent/internal/behavior/*/**'
          deny:
          - pkg: 'github.com/haryoiro/suzuha/internal/behavior'
            desc: 'behavior 同士の直接 import は禁止'
          - pkg: 'github.com/haryoiro/suzuha/internal/capability'
            desc: 'behavior → capability は port/ 経由のみ'

        # adapter は port / domain / lib / observe のみ
        adapter-only-port:
          list-mode: lax
          files:
          - '**/agent/internal/adapter/**'
          deny:
          - pkg: 'github.com/haryoiro/suzuha/internal/capability'
            desc: 'adapter は capability を import しない'
          - pkg: 'github.com/haryoiro/suzuha/internal/behavior'
            desc: 'adapter は behavior を import しない'
          - pkg: 'github.com/haryoiro/suzuha/internal/runtime'
            desc: 'adapter は runtime を import しない'

        # feature/X は 他 feature/Y を import 禁止 (現行 layout の暫定ルール、
        # Phase 8d で behavior/ に移動したら behavior-siblings が引き継ぐ)
        feature-siblings:
          list-mode: lax
          files:
          - '**/agent/internal/feature/*/**'
          deny:
          - pkg: 'github.com/haryoiro/suzuha/internal/feature'
            desc: 'feature 同士の直接 import は禁止 (architecture.md 参照)'

  exclusions:
    presets:
    - common-false-positives
    rules:
    - text: "empty-block:"
      linters: [revive]
    - text: "unused-parameter:"
      linters: [revive]
    - text: "dot-imports:"
      linters: [revive]
    - text: should have a package comment
      linters: [revive]
    - text: should have comment or be unexported
      linters: [revive]
    - text: "comment on exported"
      linters: [revive]
    - text: "type name will be used as"
      linters: [revive]
    - text: "avoid package names that conflict"
      linters: [revive]
    - text: "var-naming"
      linters: [revive]
    - text: error strings should not be capitalized or end with punctuation or a newline
      linters: [revive, staticcheck]
